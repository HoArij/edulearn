<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catalogue des cours - EduLearn">
  <title>Cours - EduLearn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="../js/i18n.js" defer></script>
  <script src="../js/data.js" defer></script>
  <script src="../js/app.js" defer></script>
</head>
<body data-page="courses" data-root="../">

  <header class="site-header" id="site-header"></header>

  <main class="container page">
    <!-- <div class="page-head">
      <h1 data-i18n="courses.title"></h1>
      <p class="muted" data-i18n="courses.sub"></p>
    </div> -->
    <div class="page-head">
      <h1 data-i18n="courses.title">Catalogue des cours</h1>
      <p class="muted" data-i18n="courses.sub">Choisissez une matière et commencez à apprendre.</p>
    </div>
    <div class="toolbar">
      <input type="search" id="search" data-i18n-placeholder="courses.search" aria-label="Search">
      <select id="level-filter" aria-label="Level"></select>
    </div>
    <div class="chips" id="chips" role="tablist"></div>

    <div class="grid" id="course-grid"></div>
    <p class="empty" id="empty" hidden data-i18n="courses.none"></p>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
